<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>

        .login-btn:disabled{background:#d0c0c0;cursor:not-allowed}
        .login-error{color:#e57373;font-size:13px;margin-top:10px;display:none}
        .login-error.show{display:block}
        .login-hint{color:#c8b0b0;font-size:12px;margin-top:15px}
        .sync-notice{background:#e3f2fd;border:1px solid #90caf9;border-radius:12px;padding:15px;margin-bottom:15px;text-align:left}
        .sync-notice-title{color:#1565c0;font-size:13px;font-weight:500;margin-bottom:8px}
        .sync-notice-item{color:#666;font-size:12px;margin-bottom:6px}
        .container{max-width:600px;margin:0 auto;display:none}
        .container.show{display:block}
        .header{text-align:center;padding:30px 20px;position:relative}
        .header::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:3px;background:linear-gradient(90deg,#e8a4a4,#f5c6c6);border-radius:2px}
        .header h1{color:#c48484;font-size:26px;font-weight:500;margin-bottom:8px;letter-spacing:3px}
        .header p{color:#b8a0a0;font-size:13px}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-btn{background:#fff;color:#c48484;border:1px solid #f0d4d4;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .3s}
        .top-btn:hover{background:#fff5f5}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#c48484;border:1px solid #f0d4d4;padding:10px 20px;border-radius:25px;font-size:14px;text-decoration:none;transition:all .3s}
        .back-btn:hover{background:#fff5f5}
        .config-section{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
        .section-title{color:#c48484;font-size:16px;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #f0e8e8;display:flex;align-items:center;gap:8px}
        .form-group{margin-bottom:15px}
        .form-group:last-child{margin-bottom:0}
        .form-label{display:block;color:#8a7a7a;font-size:13px;margin-bottom:6px;font-weight:500}
        .form-input{width:100%;padding:10px 14px;border:2px solid #f0e8e8;border-radius:10px;font-size:15px;color:#5a4a4a;transition:all .3s;background:#fdfbfb}
        .form-input:focus{outline:none;border-color:#e8a4a4}
        .form-input.small{font-size:13px;padding:8px 12px}
        .color-picker-wrapper{display:flex;align-items:center;gap:12px}
        .color-picker{width:44px;height:44px;border:none;border-radius:10px;cursor:pointer;padding:0;overflow:hidden}
        .color-picker::-webkit-color-swatch-wrapper{padding:0}
        .color-picker::-webkit-color-swatch{border:2px solid #f0e8e8;border-radius:8px}
        .color-value{flex:1;padding:10px 14px;border:2px solid #f0e8e8;border-radius:10px;font-size:13px;color:#5a4a4a;background:#fdfbfb;font-family:monospace}
        .preset-colors{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
        .preset-color{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:all .3s}
        .preset-color:hover{transform:scale(1.1);border-color:#5a4a4a}
        .preset-color.active{border-color:#5a4a4a;box-shadow:0 2px 8px rgba(0,0,0,.2)}
        .toggle-group{display:flex;align-items:center;justify-content:space-between}
        .toggle{position:relative;width:50px;height:28px}
        .toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e0d0d0;transition:.3s;border-radius:28px}
        .toggle-slider::before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.2)}
        .toggle input:checked+.toggle-slider{background:linear-gradient(135deg,#e8a4a4,#d49191)}
        .toggle input:checked+.toggle-slider::before{transform:translateX(22px)}
        .btn-group{display:flex;gap:12px;margin-top:20px}
        .btn{flex:1;padding:14px 20px;border:none;border-radius:25px;font-size:15px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary{background:linear-gradient(135deg,#e8a4a4,#d49191);color:#fff;box-shadow:0 4px 15px rgba(232,164,164,.4)}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-secondary{background:#fff;color:#c48484;border:2px solid #f0d4d4}
        .btn-secondary:hover{background:#fff5f5}
        .btn-small{padding:8px 16px;font-size:13px;border-radius:20px}
        .preview-box{background:#fdfbfb;border-radius:15px;padding:25px;text-align:center;border:2px dashed #f0d4d4}
        .preview-title{font-size:22px;margin-bottom:8px;color:#333}
        .preview-subtitle{font-size:13px;color:#888}
        .link-box{background:#f5f5f5;border-radius:10px;padding:12px;margin-bottom:15px}
        .link-box-label{font-size:12px;color:#888;margin-bottom:6px}
        .link-box-content{display:flex;align-items:center;gap:10px}

        .copy-btn{padding:6px 12px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;cursor:pointer;color:#666}
        .copy-btn:hover{background:#f0f0f0}
        .link-box-hint{font-size:11px;color:#999;margin-top:6px}
        .status-bar{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:10px;padding:12px 15px;margin-bottom:15px;font-size:13px;color:#2e7d32;display:flex;align-items:center;gap:10px}

        .status-bar.error .status-dot{background:#f44336}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;opacity:0;transition:all .3s;z-index:1000}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        .guide-box{background:#fff8e6;border:1px solid #ffe4a0;border-radius:12px;padding:15px;margin-bottom:15px}
        .guide-box-title{color:#996600;font-size:14px;font-weight:500;margin-bottom:10px}
        .guide-box-step{color:#666;font-size:12px;margin-bottom:6px;display:flex;gap:8px}
        .guide-box-step span:first-child{color:#ff9800;font-weight:bold}
        .cloud-status{padding:10px 15px;border-radius:10px;font-size:13px;margin-bottom:15px;display:flex;align-items:center;gap:10px}
        .cloud-status.connected{background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32}
        .cloud-status.disconnected{background:#f5f5f5;border:1px solid #e0e0e0;color:#666}
        .cloud-status.error{background:#ffebee;border:1px solid #ef9a9a;color:#c62828}
        @media(max-width:480px){.header h1{font-size:22px}.btn-group{flex-direction:column}}
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-container" id="loginPage">
        <div class="login-icon">💒</div>
        <h1 class="login-title">管理后台</h1>

    <!-- 设置页 -->
    <div class="container" id="configPage">

            <button class="top-btn" onclick="logout()">退出登录</button>

        </div>

        <div class="config-section">
            <div class="section-title">☁️ 云存储配置</div>

        <div class="config-section">
            <div class="section-title">📝 文字设置</div>

                <input type="text" class="form-input" id="pageTitle" placeholder="输入页面标题" maxlength="30">

        <div class="config-section">

                <label class="form-label">主题色</label>
                <div class="color-picker-wrapper">

                    <div class="preset-color" style="background:#8b7355" data-color="#8b7355"></div>

        <div class="config-section">
            <div class="section-title">👁️ 效果预览</div>
            <div class="preview-box">
                <div class="preview-title" id="previewTitle">婚礼照片收集</div>
                <div class="preview-subtitle" id="previewSubtitle">记录美好瞬间 · 分享幸福时刻</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="syncFromCloud()">📥 同步云端</button>
            <button class="btn btn-secondary" onclick="resetConfig()">恢复默认</button>
            <button class="btn btn-primary" onclick="saveConfig()">💾 保存并同步</button>
        </div>

    <div class="toast" id="toast"></div>

    <script>
        const CONFIG_KEY = 'wedding-config.json';
        const defaultConfig = {
            pageTitle: '婚礼照片收集',
            pageSubtitle: '记录美好瞬间 · 分享幸福时刻',
            uploadText: '点击或拖拽上传照片',
            statLabel: '已收集照片',
            themeColor: '#c48484',
            showDecorations: true,
            adminPassword: ''
        };

        let currentConfig = { ...defaultConfig };
        let cloudConfig = {};
        let adminPassword = '';

        // 加载云配置
        function loadCloudConfig() {
            const saved = localStorage.getItem('cloudConfig');
            if (saved) {
                cloudConfig = JSON.parse(saved);
            }
            return cloudConfig;
        }

        // 保存云配置
        function saveCloudConfig() {
            localStorage.setItem('cloudConfig', JSON.stringify(cloudConfig));
        }

        // 检查登录状态
        function checkLogin() {
            loadCloudConfig();
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showConfigPage();
            } else {
                showLoginPage();
            }
        }

        function showLoginPage() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('configPage').classList.remove('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.remove('show');

            if (cloudConfig.bucket) {
                document.getElementById('bucketInput').value = cloudConfig.bucket || '';
                document.getElementById('regionInput').value = cloudConfig.region || 'ap-shanghai';
                document.getElementById('secretIdInput').value = cloudConfig.secretId || '';
                document.getElementById('secretKeyInput').value = cloudConfig.secretKey || '';
            }

            const btn = document.getElementById('loginBtn');
            const subtitle = document.getElementById('loginSubtitle');
            if (cloudConfig.adminPassword) {
                subtitle.textContent = '请输入管理密码';
                btn.textContent = '验证密码并连接';
            } else {
                subtitle.textContent = '请设置管理员密码';
                btn.textContent = '确认并连接云端';
            }
        }

        function showConfigPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('configPage').classList.add('show');
            applyToForm();
            updatePreview();
            updateShareUrl();
            testCloud();
        }

        // 腾讯云签名
        function createSignature(method, key, query, headers, secretId, secretKey) {
            const date = new Date().toISOString().split('T')[0];
            const signTime = Math.floor(Date.now()/1000) - 300 + ';' + (Math.floor(Date.now()/1000) + 3600);
            
            const httpString = method.toLowerCase() + '\n/' + key.split('?')[0] + '\n' + (query || '') + '\n' + 
                'host:' + cloudConfig.bucket + '.cos.' + cloudConfig.region + '.myqcloud.com\n\n';
            
            const sha1edHttpString = CryptoJS.SHA1(httpString).toString();
            const stringToSign = 'sha1\n' + signTime + '\n' + sha1edHttpString + '\n';
            const signature = CryptoJS.HmacSHA1(stringToSign, secretKey).toString();
            
            return {
                signature: signature,
                signTime: signTime
            };
        }

        // 简单的SHA1实现
        const CryptoJS = {
            SHA1: function(s) {
                function rotl(n,s) {return (n<<s)|(n>>>(32-s));}
                function sha1hex(num) {
                    var hex="";for(var j=0;j<num.length*32;j+=8)hex+=((num[j>>5]>>>(24-j%32))&1).toString(16);
                    return hex;
                }
                function sha1blk(s) {
                    var blks=[];for(var i=0;i<s.length*8;i+=512){var blk=s.slice(i,i+512);
                        var words=[];for(var j=0;j<16;j++)words[j]=blk.readInt32BE(j*4);
                        words[15]=s.length*8;blks.push(words);}
                    var h=0x67452301,ee=0xEFCDAB89,a8=0x98BADCFE,f3=0x10325476,c1=0xC3D2E1F0;
                    blks.forEach(function(blk){
                        var w=[];for(var j=0;j<80;j++)w[j]=j<16?blk[j]:rotl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);
                        var hh=h,ee2=ee,a3=a8,f=f3,c2=c1;
                        for(var j=0;j<80;j++){
                            var r=(j/20)|0,t=rotl(hh,5)+((r==0?ee2:(r==1?a8:f)))+c2+w[j]+(r==0?0x5A827999:(r==1?0x6ED9EBA1:(r==2?0x8F1BBCDC:0xCA62C1D6)))|0;
                            c2=f;f=a8;a8=rotl(ee2,30);ee2=hh;hh=t;
                        }
                        h=h+hh|0;ee=ee+ee2|0;a8=a8+a3|0;f=f+c1|0;c1=c1+c2|0;
                    });
                    return [h,ee,a8,f,c1];
                }
                return sha1hex(sha1blk(s));
            },
            HmacSHA1: function(s,k) {
                function f(b,c,d){return(c&b)+((~c)&d);}
                function g(b,c){return(b&c)+((~b)&d);}
                function h(b,c,d){return b^c^d;}
                function R(b,c){return(b>>>c)|(b<<(32-c));}
                var ba=s.split('').map(function(c){return c.charCodeAt(0);});
                var M=64,O=[];
                ba.push(0x80);while(ba.length%M)ba.push(0);
                var K=[0x5a827999,0x6ed9eba1,0x8f1bbcdc,0xca62c1d6];
                var L=ba.length/4|0,H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
                for(var i=0;i<L;i++){
                    var w=[],B=ba.slice(i*64,(i+1)*64);
                    for(var j=0;j<16;j++)w[j]=B.readInt32BE(j*4);
                    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4];
                    for(var j=0;j<80;j++){
                        var t=R(a,5)+((j<20)?(b^c^d)+0x5a827999:(j<40?b^c^d+0x6ed9eba1:(j<60?(b|c)+0x8f1bbcdc:b^c^d+0xca62c1d6)))+e+w[j]+K[(j/20)|0]|0;
                        e=d;d=c;c=R(b,30);b=a;a=t;
                    }
                    H[0]=H[0]+a|0;H[1]=H[1]+b|0;H[2]=H[2]+c|0;H[3]=H[3]+d|0;H[4]=H[4]+e|0;
                }
                return H.map(function(x){return x.toString(16).padStart(8,'0');}).join('');
            }
        };

        // 获取临时凭证
        async function getTempCredential() {
            const now = Math.floor(Date.now() / 1000);
            const exp = now + 3600;
            
            const secretId = cloudConfig.secretId;
            const secretKey = cloudConfig.secretKey;
            
            const signTime = now + ';' + exp;
            const httpString = 'cos.getCredential\n' + CONFIG_KEY + '\nhost=' + cloudConfig.bucket + '.cos.' + cloudConfig.region + '.myqcloud.com\n';
            const stringToSign = 'sha1\n' + signTime + '\n' + CryptoJS.SHA1(httpString) + '\n';
            const signature = CryptoJS.HmacSHA1(stringToSign, secretKey);
            
            return { signature, signTime };
        }

        // 测试云连接
        async function testCloud() {
            if (!cloudConfig.bucket || !cloudConfig.secretId || !cloudConfig.secretKey) {
                updateCloudStatus('disconnected', '请先配置云存储信息');
                return;
            }

            updateCloudStatus('syncing', '正在连接...');

            try {
                const cred = await getTempCredential();
                const host = cloudConfig.bucket + '.cos.' + cloudConfig.region + '.myqcloud.com';
                const url = 'https://' + host + '/' + CONFIG_KEY;

                const signature = cred.signature;
                const auth = 'q-sign-algorithm=sha1&q-ak=' + cloudConfig.secretId + '&q-sign-time=' + cred.signTime + '&q-key-time=' + cred.signTime + '&q-header-list=host&q-url-param-list=&q-signature=' + signature;

                const res = await fetch(url + '?' + auth, { method: 'HEAD' });
                
                if (res.ok || res.status === 404) {
                    updateCloudStatus('connected', '云端已连接');
                } else {
                    updateCloudStatus('error', '连接失败');
                }
            } catch (e) {
                updateCloudStatus('error', '连接失败: ' + e.message);
            }
        }

        function updateCloudStatus(type, text) {
            const el = document.getElementById('cloudStatus');
            const textEl = document.getElementById('cloudStatusText');
            el.className = 'cloud-status ' + type;
            textEl.textContent = text;
        }

        // 从云端加载配置
        async function loadFromCloud() {
            if (!cloudConfig.bucket || !cloudConfig.secretId || !cloudConfig.secretKey) return null;

            try {
                const cred = await getTempCredential();
                const host = cloudConfig.bucket + '.cos.' + cloudConfig.region + '.myqcloud.com';
                const url = 'https://' + host + '/' + CONFIG_KEY;

                const auth = 'q-sign-algorithm=sha1&q-ak=' + cloudConfig.secretId + '&q-sign-time=' + cred.signTime + '&q-key-time=' + cred.signTime + '&q-header-list=host&q-url-param-list=&q-signature=' + cred.signature;

                const res = await fetch(url + '?' + auth);
                if (res.ok) {
                    const data = await res.json();
                    return data;
                }
            } catch (e) {
                console.log('加载云配置失败', e);
            }
            return null;
        }

        // 保存到云端
        async function saveToCloud(config) {
            if (!cloudConfig.bucket || !cloudConfig.secretId || !cloudConfig.secretKey) {
                showToast('请先配置云存储');
                return false;
            }

            try {
                updateCloudStatus('syncing', '正在同步...');
                
                const cred = await getTempCredential();
                const host = cloudConfig.bucket + '.cos.' + cloudConfig.region + '.myqcloud.com';
                const url = 'https://' + host + '/' + CONFIG_KEY;

                const auth = 'q-sign-algorithm=sha1&q-ak=' + cloudConfig.secretId + '&q-sign-time=' + cred.signTime + '&q-key-time=' + cred.signTime + '&q-header-list=host&q-url-param-list=&q-signature=' + cred.signature;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Host': host,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                if (res.ok) {
                    updateCloudStatus('connected', '已同步到云端');
                    return true;
                }
            } catch (e) {
                updateCloudStatus('error', '同步失败');
            }
            return false;
        }

        // 执行登录
        async function doLogin() {
            const bucket = document.getElementById('bucketInput').value.trim();
            const region = document.getElementById('regionInput').value.trim() || 'ap-shanghai';
            const secretId = document.getElementById('secretIdInput').value.trim();
            const secretKey = document.getElementById('secretKeyInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!bucket || !secretId || !secretKey) {
                document.getElementById('loginError').textContent = '请填写完整的云存储信息';
                document.getElementById('loginError').classList.add('show');
                return;
            }

            cloudConfig = { bucket, region, secretId, secretKey };
            saveCloudConfig();

            if (cloudConfig.adminPassword) {
                if (password !== cloudConfig.adminPassword) {
                    document.getElementById('loginError').textContent = '密码错误';
                    document.getElementById('loginError').classList.add('show');
                    return;
                }
                sessionStorage.setItem('adminLoggedIn', 'true');
                showConfigPage();
                return;
            }

            if (password.length < 4) {
                document.getElementById('loginError').textContent = '密码至少4位';
                document.getElementById('loginError').classList.add('show');
                return;
            }

            cloudConfig.adminPassword = password;
            adminPassword = password;
            saveCloudConfig();

            const config = { ...defaultConfig, adminPassword: password };
            await saveToCloud(config);

            sessionStorage.setItem('adminLoggedIn', 'true');
            showToast('密码已设置并同步到云端');
            showConfigPage();
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            showLoginPage();
        }

        function applyToForm() {
            document.getElementById('bucket').value = cloudConfig.bucket || '';
            document.getElementById('region').value = cloudConfig.region || 'ap-shanghai';
            document.getElementById('secretId').value = cloudConfig.secretId || '';
            document.getElementById('secretKey').value = cloudConfig.secretKey || '';

            document.getElementById('pageTitle').value = currentConfig.pageTitle;
            document.getElementById('pageSubtitle').value = currentConfig.pageSubtitle;
            document.getElementById('uploadText').value = currentConfig.uploadText;
            document.getElementById('statLabel').value = currentConfig.statLabel;
            document.getElementById('themeColorPicker').value = currentConfig.themeColor;
            document.getElementById('themeColorValue').value = currentConfig.themeColor;
            document.getElementById('showDecorations').checked = currentConfig.showDecorations !== false;
            updatePresetActive();
        }

        function updatePresetActive() {
            document.querySelectorAll('.preset-color').forEach(el => {
                el.classList.toggle('active', el.dataset.color === currentConfig.themeColor);
            });
        }

        function updatePreview() {
            document.getElementById('previewTitle').textContent = currentConfig.pageTitle;
            document.getElementById('previewTitle').style.color = currentConfig.themeColor;
            document.getElementById('previewSubtitle').textContent = currentConfig.pageSubtitle;
        }

        function updateShareUrl() {
            document.getElementById('shareUrl').textContent = window.location.href.replace('admin.html', 'index.html');
        }

        async function saveConfig() {
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (newPwd) {
                if (newPwd.length < 4) { showToast('密码至少4位'); return; }
                if (newPwd !== confirmPwd) { showToast('两次密码不一致'); return; }
                cloudConfig.adminPassword = newPwd;
                showToast('密码已修改');
            }

            // 保存云配置
            cloudConfig.bucket = document.getElementById('bucket').value.trim();
            cloudConfig.region = document.getElementById('region').value.trim() || 'ap-shanghai';
            cloudConfig.secretId = document.getElementById('secretId').value.trim();
            cloudConfig.secretKey = document.getElementById('secretKey').value.trim();
            saveCloudConfig();

            currentConfig = {
                ...currentConfig,
                pageTitle: document.getElementById('pageTitle').value || defaultConfig.pageTitle,
                pageSubtitle: document.getElementById('pageSubtitle').value || defaultConfig.pageSubtitle,
                uploadText: document.getElementById('uploadText').value || defaultConfig.uploadText,
                statLabel: document.getElementById('statLabel').value || defaultConfig.statLabel,
                themeColor: document.getElementById('themeColorValue').value,
                showDecorations: document.getElementById('showDecorations').checked,
                adminPassword: cloudConfig.adminPassword
            };

            localStorage.setItem('weddingPhotoConfig', JSON.stringify(currentConfig));

            const success = await saveToCloud(currentConfig);
            if (success) {
                showToast('配置已保存并同步到云端');
            }

            updatePreview();
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        async function syncFromCloud() {
            showToast('正在同步...');
            const cloudData = await loadFromCloud();
            if (cloudData) {
                currentConfig = { ...defaultConfig, ...cloudData };
                cloudConfig.adminPassword = cloudData.adminPassword || '';
                localStorage.setItem('weddingPhotoConfig', JSON.stringify(currentConfig));
                applyToForm();
                updatePreview();
                showToast('已从云端同步');
            } else {
                showToast('云端无配置或同步失败');
            }
        }

        function resetConfig() {
            if (confirm('确定要恢复默认设置吗？')) {
                currentConfig = { ...defaultConfig };
                applyToForm();
                updatePreview();
                showToast('已恢复默认');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyLink() {
            const url = window.location.href.replace('admin.html', 'index.html');
            navigator.clipboard.writeText(url);
            showToast('链接已复制');
        }

        // 颜色
        document.getElementById('themeColorPicker').addEventListener('input', (e) => {
            document.getElementById('themeColorValue').value = e.target.value;
            updatePresetActive();
        });
        document.getElementById('themeColorValue').addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                document.getElementById('themeColorPicker').value = e.target.value;
                updatePresetActive();
            }
        });
        document.getElementById('presetColors').addEventListener('click', (e) => {
            const preset = e.target.closest('.preset-color');
            if (preset) {
                document.getElementById('themeColorPicker').value = preset.dataset.color;
                document.getElementById('themeColorValue').value = preset.dataset.color;
                updatePresetActive();
            }
        });
        document.getElementById('pageTitle').addEventListener('input', updatePreview);
        document.getElementById('pageSubtitle').addEventListener('input', updatePreview);

        checkLogin();
    </script>
</body>
</html>
