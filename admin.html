<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>婚礼照片收集 - 管理后台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#fdf6f0 0%,#fff5f5 50%,#fdf2f8 100%);min-height:100vh;padding:20px}
        .login-container{max-width:400px;margin:80px auto;text-align:center}
        .login-icon{font-size:60px;margin-bottom:20px}
        .login-title{color:#c48484;font-size:24px;margin-bottom:10px}
        .login-subtitle{color:#b8a0a0;font-size:14px;margin-bottom:30px}
        .login-box{background:#fff;border-radius:20px;padding:40px 30px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
        .login-box input{width:100%;padding:15px;border:2px solid #f0e8e8;border-radius:12px;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:15px;transition:all .3s}
        .login-box input:focus{outline:none;border-color:#e8a4a4}
        .login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#e8a4a4,#d49191);color:#fff;border:none;border-radius:12px;font-size:16px;cursor:pointer;transition:all .3s}
        .login-btn:hover{transform:translateY(-2px)}
        .login-error{color:#e57373;font-size:13px;margin-top:10px;display:none}
        .login-error.show{display:block}
        .login-hint{color:#c8b0b0;font-size:12px;margin-top:15px}
        .container{max-width:600px;margin:0 auto;display:none}
        .container.show{display:block}
        .header{text-align:center;padding:30px 20px;position:relative}
        .header::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:3px;background:linear-gradient(90deg,#e8a4a4,#f5c6c6);border-radius:2px}
        .header h1{color:#c48484;font-size:26px;font-weight:500;margin-bottom:8px;letter-spacing:3px}
        .header p{color:#b8a0a0;font-size:13px}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-btn{background:#fff;color:#c48484;border:1px solid #f0d4d4;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .3s}
        .top-btn:hover{background:#fff5f5}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#c48484;border:1px solid #f0d4d4;padding:10px 20px;border-radius:25px;font-size:14px;text-decoration:none;transition:all .3s}
        .back-btn:hover{background:#fff5f5}
        .config-section{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
        .section-title{color:#c48484;font-size:16px;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #f0e8e8;display:flex;align-items:center;gap:8px}
        .form-group{margin-bottom:15px}
        .form-group:last-child{margin-bottom:0}
        .form-label{display:block;color:#8a7a7a;font-size:13px;margin-bottom:6px;font-weight:500}
        .form-input{width:100%;padding:10px 14px;border:2px solid #f0e8e8;border-radius:10px;font-size:15px;color:#5a4a4a;transition:all .3s;background:#fdfbfb}
        .form-input:focus{outline:none;border-color:#e8a4a4}
        .color-picker-wrapper{display:flex;align-items:center;gap:12px}
        .color-picker{width:44px;height:44px;border:none;border-radius:10px;cursor:pointer;padding:0;overflow:hidden}
        .color-picker::-webkit-color-swatch-wrapper{padding:0}
        .color-picker::-webkit-color-swatch{border:2px solid #f0e8e8;border-radius:8px}
        .color-value{flex:1;padding:10px 14px;border:2px solid #f0e8e8;border-radius:10px;font-size:13px;color:#5a4a4a;background:#fdfbfb;font-family:monospace}
        .preset-colors{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
        .preset-color{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:all .3s}
        .preset-color:hover{transform:scale(1.1);border-color:#5a4a4a}
        .preset-color.active{border-color:#5a4a4a;box-shadow:0 2px 8px rgba(0,0,0,.2)}
        .toggle-group{display:flex;align-items:center;justify-content:space-between}
        .toggle{position:relative;width:50px;height:28px}
        .toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e0d0d0;transition:.3s;border-radius:28px}
        .toggle-slider::before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.2)}
        .toggle input:checked+.toggle-slider{background:linear-gradient(135deg,#e8a4a4,#d49191)}
        .toggle input:checked+.toggle-slider::before{transform:translateX(22px)}
        .btn-group{display:flex;gap:12px;margin-top:20px}
        .btn{flex:1;padding:14px 20px;border:none;border-radius:25px;font-size:15px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary{background:linear-gradient(135deg,#e8a4a4,#d49191);color:#fff;box-shadow:0 4px 15px rgba(232,164,164,.4)}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-secondary{background:#fff;color:#c48484;border:2px solid #f0d4d4}
        .btn-secondary:hover{background:#fff5f5}
        .btn-small{padding:10px 16px;font-size:13px;border-radius:20px}
        .preview-box{background:#fdfbfb;border-radius:15px;padding:25px;text-align:center;border:2px dashed #f0d4d4}
        .preview-title{font-size:22px;margin-bottom:8px;color:#333}
        .preview-subtitle{font-size:13px;color:#888}
        .link-box{background:#f5f5f5;border-radius:10px;padding:12px;margin-bottom:15px}
        .link-box-label{font-size:12px;color:#888;margin-bottom:6px}
        .link-box-content{display:flex;align-items:center;gap:10px}
        .link-box-url{flex:1;font-size:14px;color:#c48484;word-break:break-all}
        .copy-btn{padding:6px 12px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;cursor:pointer;color:#666}
        .copy-btn:hover{background:#f0f0f0}
        .link-box-hint{font-size:11px;color:#999;margin-top:6px}
        .guide-box{background:#fff8e6;border:1px solid #ffe4a0;border-radius:12px;padding:15px;margin-bottom:15px}
        .guide-box-title{color:#996600;font-size:14px;font-weight:500;margin-bottom:10px}
        .guide-box-step{color:#666;font-size:12px;margin-bottom:8px;display:flex;gap:8px}
        .guide-box-step span:first-child{color:#ff9800;font-weight:bold}
        .cloud-url-box{background:#e3f2fd;border:1px solid #90caf9;border-radius:12px;padding:15px;margin-bottom:15px}
        .cloud-url-title{color:#1565c0;font-size:14px;font-weight:500;margin-bottom:10px}
        .cloud-url-content{font-size:13px;color:#333;word-break:break-all;background:#fff;padding:10px;border-radius:8px;margin-bottom:10px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;opacity:0;transition:all .3s;z-index:1000}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        @media(max-width:480px){.header h1{font-size:22px}.btn-group{flex-direction:column}}
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-container" id="loginPage">
        <div class="login-icon">💒</div>
        <h1 class="login-title">管理后台</h1>
        <p class="login-subtitle" id="loginSubtitle">请设置管理员密码</p>
        
        <div class="login-box">
            <input type="password" id="passwordInput" placeholder="设置/输入密码（至少4位）" maxlength="20">
            <button class="login-btn" id="loginBtn" onclick="doLogin()">进入后台</button>
            <p class="login-error" id="loginError">密码错误</p>
        </div>
        
        <p class="login-hint">修改配置后需下载并上传到云端</p>
    </div>

    <!-- 设置页 -->
    <div class="container" id="configPage">
        <div class="top-bar">
            <button class="top-btn" onclick="logout()">退出登录</button>
            <a href="index.html" class="back-btn">← 返回首页</a>
        </div>

        <div class="header">
            <h1>管理后台</h1>
            <p>配置管理 · 手动同步</p>
        </div>

        <div class="link-box">
            <div class="link-box-label">📤 宾客访问链接</div>
            <div class="link-box-content">
                <span class="link-box-url" id="shareUrl">index.html</span>
                <button class="copy-btn" onclick="copyLink()">复制</button>
            </div>
        </div>

        <div class="guide-box">
            <div class="guide-box-title">📤 同步到云端步骤</div>
            <div class="guide-box-step"><span>1.</span> 修改下方配置后点击「下载配置」</div>
            <div class="guide-box-step"><span>2.</span> 登录腾讯云COS控制台</div>
            <div class="guide-box-step"><span>3.</span> 进入存储桶，上传下载的配置文件</div>
            <div class="guide-box-step"><span>4.</span> 文件名改为：wedding-config.json</div>
        </div>

        <div class="cloud-url-box">
            <div class="cloud-url-title">☁️ 配置文件访问地址</div>
            <div class="cloud-url-content" id="cloudUrl">设置后显示配置地址</div>
            <div class="guide-box-step"><span>💡</span> 将此地址填入云存储设置中即可自动同步</div>
        </div>

        <div class="config-section">
            <div class="section-title">☁️ 云存储设置</div>
            <div class="form-group">
                <label class="form-label">配置文件地址（完整URL）</label>
                <input type="text" class="form-input" id="customUrl" placeholder="例如：https://xxx.github.io/仓库/wedding-config.json">
            </div>
        </div>

        <div class="config-section">
            <div class="section-title">🔐 修改密码</div>
            <div class="form-group">
                <input type="password" class="form-input" id="newPassword" placeholder="输入新密码（不修改请留空）" maxlength="20">
            </div>
            <div class="form-group">
                <input type="password" class="form-input" id="confirmPassword" placeholder="确认新密码" maxlength="20">
            </div>
        </div>

        <div class="config-section">
            <div class="section-title">📝 文字设置</div>
            <div class="form-group">
                <label class="form-label">页面标题</label>
                <input type="text" class="form-input" id="pageTitle" placeholder="输入页面标题" maxlength="30">
            </div>
            <div class="form-group">
                <label class="form-label">副标题描述</label>
                <input type="text" class="form-input" id="pageSubtitle" placeholder="输入副标题" maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">上传提示文字</label>
                <input type="text" class="form-input" id="uploadText" placeholder="点击或拖拽上传照片" maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label">照片统计标签</label>
                <input type="text" class="form-input" id="statLabel" placeholder="已收集照片" maxlength="10">
            </div>
        </div>

        <div class="config-section">
            <div class="section-title">🎨 颜色设置</div>
            <div class="form-group">
                <label class="form-label">主题色</label>
                <div class="color-picker-wrapper">
                    <input type="color" class="color-picker" id="themeColorPicker" value="#c48484">
                    <input type="text" class="color-value" id="themeColorValue" value="#c48484" maxlength="7">
                </div>
                <div class="preset-colors" id="presetColors">
                    <div class="preset-color active" style="background:#c48484" data-color="#c48484"></div>
                    <div class="preset-color" style="background:#8b7355" data-color="#8b7355"></div>
                    <div class="preset-color" style="background:#7a9e7e" data-color="#7a9e7e"></div>
                    <div class="preset-color" style="background:#6b8cae" data-color="#6b8cae"></div>
                    <div class="preset-color" style="background:#9b7bb8" data-color="#9b7bb8"></div>
                    <div class="preset-color" style="background:#c9a86c" data-color="#c9a86c"></div>
                    <div class="preset-color" style="background:#d4726a" data-color="#d4726a"></div>
                    <div class="preset-color" style="background:#4a4a4a" data-color="#4a4a4a"></div>
                </div>
            </div>
        </div>

        <div class="config-section">
            <div class="section-title">✨ 其他设置</div>
            <div class="form-group toggle-group">
                <label class="form-label">显示浮动装饰</label>
                <label class="toggle">
                    <input type="checkbox" id="showDecorations" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="config-section">
            <div class="section-title">👁️ 效果预览</div>
            <div class="preview-box">
                <div class="preview-title" id="previewTitle">婚礼照片收集</div>
                <div class="preview-subtitle" id="previewSubtitle">记录美好瞬间 · 分享幸福时刻</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="downloadConfig()">📥 下载配置</button>
            <button class="btn btn-secondary" onclick="resetConfig()">恢复默认</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const defaultConfig = {
            pageTitle: '婚礼照片收集',
            pageSubtitle: '记录美好瞬间 · 分享幸福时刻',
            uploadText: '点击或拖拽上传照片',
            statLabel: '已收集照片',
            themeColor: '#c48484',
            showDecorations: true,
            adminPassword: ''
        };

        let currentConfig = { ...defaultConfig };
        let adminPassword = '';

        function checkLogin() {
            adminPassword = localStorage.getItem('adminPassword') || '';
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showConfigPage();
            } else {
                showLoginPage();
            }
        }

        function showLoginPage() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('configPage').classList.remove('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.remove('show');

            const subtitle = document.getElementById('loginSubtitle');
            const btn = document.getElementById('loginBtn');
            if (adminPassword) {
                subtitle.textContent = '请输入管理员密码';
                btn.textContent = '登录';
            } else {
                subtitle.textContent = '请设置管理员密码';
                btn.textContent = '确认';
            }
        }

        function showConfigPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('configPage').classList.add('show');
            loadConfig();
            updateShareUrl();
        }

        function doLogin() {
            const password = document.getElementById('passwordInput').value;

            if (!adminPassword) {
                if (password.length < 4) {
                    document.getElementById('loginError').textContent = '密码至少4位';
                    document.getElementById('loginError').classList.add('show');
                    return;
                }
                adminPassword = password;
                localStorage.setItem('adminPassword', password);
                sessionStorage.setItem('adminLoggedIn', 'true');
                showToast('密码已设置');
                showConfigPage();
            } else {
                if (password === adminPassword) {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    showConfigPage();
                } else {
                    document.getElementById('loginError').textContent = '密码错误';
                    document.getElementById('loginError').classList.add('show');
                    document.getElementById('passwordInput').value = '';
                }
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            showLoginPage();
        }

        function loadConfig() {
            const saved = localStorage.getItem('weddingPhotoConfig');
            if (saved) {
                try {
                    currentConfig = { ...defaultConfig, ...JSON.parse(saved) };
                } catch (e) {}
            }

            const cloud = localStorage.getItem('cloudSettings');
            if (cloud) {
                const c = JSON.parse(cloud);
                document.getElementById('customUrl').value = c.customUrl || '';
                document.getElementById('cloudUrl').textContent = c.customUrl || '请设置配置文件地址';
            }

            applyToForm();
            updatePreview();
        }

        function applyToForm() {
            document.getElementById('pageTitle').value = currentConfig.pageTitle;
            document.getElementById('pageSubtitle').value = currentConfig.pageSubtitle;
            document.getElementById('uploadText').value = currentConfig.uploadText;
            document.getElementById('statLabel').value = currentConfig.statLabel;
            document.getElementById('themeColorPicker').value = currentConfig.themeColor;
            document.getElementById('themeColorValue').value = currentConfig.themeColor;
            document.getElementById('showDecorations').checked = currentConfig.showDecorations !== false;
            updatePresetActive();
        }

        function updatePresetActive() {
            document.querySelectorAll('.preset-color').forEach(el => {
                el.classList.toggle('active', el.dataset.color === currentConfig.themeColor);
            });
        }

        function updatePreview() {
            document.getElementById('previewTitle').textContent = currentConfig.pageTitle;
            document.getElementById('previewTitle').style.color = currentConfig.themeColor;
            document.getElementById('previewSubtitle').textContent = currentConfig.pageSubtitle;
        }

        function updateShareUrl() {
            document.getElementById('shareUrl').textContent = window.location.href.replace('admin.html', 'index.html');
        }

        function downloadConfig() {
            // 修改密码
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (newPwd) {
                if (newPwd.length < 4) { showToast('密码至少4位'); return; }
                if (newPwd !== confirmPwd) { showToast('两次密码不一致'); return; }
                adminPassword = newPwd;
                localStorage.setItem('adminPassword', newPwd);
                showToast('密码已修改');
            }

            // 保存云设置
            const cloud = {
                customUrl: document.getElementById('customUrl').value.trim()
            };
            localStorage.setItem('cloudSettings', JSON.stringify(cloud));
            document.getElementById('cloudUrl').textContent = cloud.customUrl || '请设置配置文件地址';

            currentConfig = {
                ...currentConfig,
                pageTitle: document.getElementById('pageTitle').value || defaultConfig.pageTitle,
                pageSubtitle: document.getElementById('pageSubtitle').value || defaultConfig.pageSubtitle,
                uploadText: document.getElementById('uploadText').value || defaultConfig.uploadText,
                statLabel: document.getElementById('statLabel').value || defaultConfig.statLabel,
                themeColor: document.getElementById('themeColorValue').value,
                showDecorations: document.getElementById('showDecorations').checked,
                adminPassword: adminPassword
            };

            localStorage.setItem('weddingPhotoConfig', JSON.stringify(currentConfig));
            updatePreview();

            // 下载配置文件
            const blob = new Blob([JSON.stringify(currentConfig, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'wedding-config.json';
            a.click();
            URL.revokeObjectURL(url);

            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';

            showToast('配置已保存，请上传到云端');
        }

        function resetConfig() {
            if (confirm('确定要恢复默认设置吗？')) {
                localStorage.removeItem('weddingPhotoConfig');
                currentConfig = { ...defaultConfig, adminPassword };
                applyToForm();
                updatePreview();
                showToast('已恢复默认');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyLink() {
            const url = window.location.href.replace('admin.html', 'index.html');
            navigator.clipboard.writeText(url);
            showToast('链接已复制');
        }

        document.getElementById('themeColorPicker').addEventListener('input', (e) => {
            document.getElementById('themeColorValue').value = e.target.value;
            updatePresetActive();
        });

        document.getElementById('themeColorValue').addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                document.getElementById('themeColorPicker').value = e.target.value;
                updatePresetActive();
            }
        });

        document.getElementById('presetColors').addEventListener('click', (e) => {
            const preset = e.target.closest('.preset-color');
            if (preset) {
                document.getElementById('themeColorPicker').value = preset.dataset.color;
                document.getElementById('themeColorValue').value = preset.dataset.color;
                updatePresetActive();
            }
        });

        document.getElementById('pageTitle').addEventListener('input', updatePreview);
        document.getElementById('pageSubtitle').addEventListener('input', updatePreview);

        checkLogin();
    </script>
</body>
</html>
